<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Learning Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <!-- fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./resources/css/styles.css">
</head>

<body>

    <!--admin cources -->

    <div class="container-fluid admin-dashboard">
        <!-- Sidebar Toggle Button for Mobile -->
        <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>

        <!-- Sidebar -->
        <nav class="col-md-2 d-md-block bg-dark sidebar">
            <div class="d-flex flex-column h-100">
                <div class="text-center my-4">
                    <img src="./resources/images/logo-2.png" alt="Logo" class="img-fluid" style="max-width: 150px;">
                </div>
                <ul class="nav flex-column flex-grow-1">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">
                            <i class="fas fa-th-large"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">
                            <i class="fas fa-book"></i> All Courses
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">
                            <i class="fas fa-search"></i> Search
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-white" href="#">
                            <i class="fas fa-cog"></i> Settings
                        </a>
                    </li>
                </ul>
                <ul class="nav flex-column">
                    <li class="nav-item mt-auto">
                        <a class="nav-link text-white" href="#">
                            <i class="fas fa-sign-out-alt"></i> Sign-out
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- all cource -->
        <div class="main-content">
            <header class="d-flex justify-content-between align-items-center">
                <div class="greeting">
                    <h5>All Course</h5>
                </div>
                <div class="d-flex align-items-center notify">
                    <button class="btn btn-light position-relative me-3" id="notificationIcon" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        <i class="fa-regular fa-bell"></i>
                        <span class="notification-dot"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="notificationIcon">
                        <li><a class="dropdown-item" href="#">Notification 1</a></li>
                        <li><a class="dropdown-item" href="#">Notification 2</a></li>
                        <li><a class="dropdown-item" href="#">Notification 3</a></li>
                    </ul>

                    <div class="dropdown">
                        <button class="btn" type="button" id="profileDropdown" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            <img src="./resources/images/profile.png" alt="Profile" class="rounded-circle" height="42">
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
                            <li><a class="dropdown-item" href="#">Profile Settings</a></li>
                            <li><a class="dropdown-item" href="#">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <!-- instructor profile settings-->
            <div class="container-fluid instructor-profile settings">
                <div class="row">

                    <main class="col-md-12 col-lg-12 p-3">
                        <section class="edit-profile position-relative">
                            <h4>Edit Profile</h4>
                            <form>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="firstName" class="form-label">First Name</label>
                                        <input type="text" class="form-control" id="firstName"
                                            placeholder="Your First Name">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="lastName" class="form-label">Last Name</label>
                                        <input type="text" class="form-control" id="lastName"
                                            placeholder="Your Last Name">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="phone" class="form-label">Phone Number</label>
                                        <input type="text" class="form-control" id="phone"
                                            placeholder="Your Phone Number">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="email" class="form-label">Email Address</label>
                                        <input type="email" class="form-control" id="email"
                                            placeholder="Your Email Address">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="country" class="form-label">Country</label>
                                        <select id="country" class="form-select">
                                            <option>Select Your Country</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="city" class="form-label">City</label>
                                        <input type="text" class="form-control" id="city" placeholder="Your City">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="address" class="form-label">Address</label>
                                        <input type="text" class="form-control" id="address" placeholder="Your Address">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="pinCode" class="form-label">Pin Code</label>
                                        <input type="text" class="form-control" id="pinCode"
                                            placeholder="Your Pin Code">
                                    </div>
                                    <div class="col-12 mb-3">
                                        <label for="about" class="form-label">About You</label>
                                        <textarea class="form-control" id="about" placeholder="Write Here"></textarea>
                                    </div>
                                </div>
                                <div class="d-flex gap-3 justify-content-center">
                                    <button type="submit" class="submit btn btn-primary"><i
                                            class="fa-solid fa-rotate-right"></i> Save Changes</button>
                                </div>
                            </form>
                        </section>

                        <section class="change-password mt-5">
                            <h4>Change Password</h4>
                            <form>
                                <div class="row">
                                    <div class="col-12 mb-3">
                                        <label for="currentPassword" class="form-label">Current Password</label>
                                        <input type="password" class="form-control" id="currentPassword"
                                            placeholder="Password">
                                    </div>
                                    <div class="col-12 mb-3">
                                        <label for="newPassword" class="form-label">New Password</label>
                                        <input type="password" class="form-control" id="newPassword"
                                            placeholder="Password">
                                    </div>
                                    <div class="col-12 mb-3">
                                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                                        <input type="password" class="form-control" id="confirmPassword"
                                            placeholder="Confirm new password">
                                    </div>
                                </div>
                                <div class="d-flex gap-3 justify-content-center">
                                    <button type="button" class="cancel btn btn-outline-primary"><i
                                            class="fa-regular fa-rectangle-xmark"></i> Cancel</button>
                                    <button type="submit" class="submit btn btn-primary"><i
                                            class="fa-solid fa-rotate-right"></i> Change Password</button>
                                </div>
                            </form>
                        </section>
                    </main>

                </div>
            </div>
        </div>
    </div>



    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="./resources/js/script.js"></script>
    <script>
        // Toggle Sidebar for Mobile
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('active');
        }

    </script>
</body>

</html>
